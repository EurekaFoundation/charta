[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charta"
version = "0.3.0"
description = "Impaginazione libera per volantini, locandine, brochure e menù: alternativa open source a Microsoft Publisher"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.0",
    "eureka-core @ git+https://github.com/EurekaFoundation/eureka-core@v0.1.1",
]
keywords = ["desktop publishing", "publisher", "impaginazione", "volantini", "scuola"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Italian",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
charta = "charta.app:main"

[project.urls]
Homepage = "https://github.com/EurekaFoundation/charta"

[tool.setuptools.packages.find]
include = ["charta*"]
